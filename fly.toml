app = 'payload-screenshot'
primary_region = 'ord'
kill_timeout = 15
swap_size_mb = 512

[env]
  OTEL_DENO = true
  OTEL_SERVICE_NAME = 'screenshot'

[[services]]
internal_port = 8000
processes = [ "app" ]
protocol = "tcp"

  [[services.ports]]
  handlers = [ "http" ]
  port = 80

  [[services.ports]]
  handlers = [ "tls", "http" ]
  port = 443

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8000
min_machines_running = 0
processes = [ "app" ]

[[vm]]
  size = 'shared-cpu-1x'
  memory = "512mb"
