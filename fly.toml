app = 'payload-screenshot'
primary_region = 'ord'
kill_timeout = 15
swap_size_mb = 512

[env]
  OTEL_DENO = true
  OTEL_SERVICE_NAME = 'screenshot'

[[services]]
internal_port = 8000
protocol = "tcp"

  [[services.ports]]
  handlers = [ "http" ]
  port = 80

  [[services.ports]]
  handlers = [ "tls", "http" ]
  port = 443

[http_service]
auto_start_machines = true
auto_stop_machines = 'suspend'
force_https = false
internal_port = 8000
min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = 512
